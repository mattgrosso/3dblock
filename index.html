<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Blockout</title>
    <meta name="description" content="3D Tetris - polycubes fall into a well, fill a layer to clear it." />
    <meta name="theme-color" content="#0b0e14" />
    <!-- vite-plugin-pwa injects the manifest link and the service-worker
         registration. These are the bits it doesn't: iOS ignores the manifest
         for home-screen launches and reads its own meta tags instead. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      `black`, NOT `black-translucent`. Measured on Matt's iPhone 16 Pro
      (402x874 CSS) on 2026-09-15, off four screenshots of Commonwealth: the
      app was drawn from the very top of the screen, but its viewport was
      only 812px tall - 62px short, exactly the status bar - so the bottom
      62px of the screen was outside the layout. Nothing could be put there;
      iOS just filled it with the page background, which read as a band of
      dead space at the bottom of every screen. That is what
      black-translucent does to a standalone web app: it hands you the screen
      MINUS the status bar and then draws you from y=0 anyway. `black` lays
      the app out below the status bar, so the viewport reaches the bottom of
      the screen and the 62px comes back. src/utils/viewport.js measures this
      at runtime.

      iOS reads this at launch: after the app updates, force-quit it and open
      it again. If the band survives that, remove the home-screen icon and
      add it from Safari again.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Blockout" />
    <!--
      Launch splash (2026-10-20). Opening the home-screen app showed a blank
      white page until the bundle arrived. The inline style paints the page
      dark from the first byte, and the .launch-splash inside #app shows the
      icon and name until main.ts builds the game, which removes it (this app
      appends to #app rather than replacing it, so nothing would otherwise).
      The apple-touch-startup-image links give iOS the same picture to show
      before the page exists at all; scripts/generate-launch-images.mjs draws
      them to this exact layout and prints these tags.
    -->
    <style>
      html, body { background-color: #0b0e14; }
      .launch-splash {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background-color: #0b0e14; color: #e6ecf7;
        font: 26px/1.2 system-ui, -apple-system, sans-serif;
      }
      .launch-splash img { width: 120px; height: 120px; margin-bottom: 14px; }
    </style>
    <link rel="apple-touch-startup-image" href="/launch/launch-1320x2868.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/launch/launch-1260x2736.png" media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/launch/launch-1206x2622.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/launch/launch-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/launch/launch-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/launch/launch-1284x2778.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/launch/launch-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/launch/launch-1125x2436.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/launch/launch-1242x2688.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/launch/launch-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="apple-touch-startup-image" href="/launch/launch-750x1334.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div class="launch-splash">
        <img src="/splash-icon.png" alt="" />
        <div>Blockout</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
